# Podman storage for the RegicideOS Dagger build engine (CONTAINERS_STORAGE_CONF).
#
# WHY THIS EXISTS: default rootless Podman stores on NFS-backed home dirs
# cannot lchown Gentoo's 'games' (GID 42) files during image unpack (EPERM),
# corrupting the engine's image store. This config pins the engine's overlay
# store to a local-filesystem path instead.
#
# PLACEHOLDER: REGICIDE_EXT4_STORAGE_DIR — the local-FS directory for the
# engine's containerd graph root (e.g. /raid/awhite/dagger-regicide-storage).
# run-dagger-build-local.sh substitutes it at runtime and writes the rendered
# copy into build-system/catalyst/generated/ (gitignored).
#
# Direct use without the wrapper: copy this file, replace the placeholder
# with a real path, and export CONTAINERS_STORAGE_CONF=<your copy>.

[storage]
driver = "overlay"
graphroot = "@REGICIDE_EXT4_STORAGE_DIR@"
runroot = "/run/user/@REGICIDE_RUNUSER_UID@/containers-dagger-regicide"
