# Podman full config for the Dagger engine build (CONTAINERS_CONF).
#
# The engine container is created podman's docker-compat path, which defaults
# to PidsLimit=2048 when unset. A 224-core Gentoo stage build (22 parallel
# emerge jobs; go toolchain bootstrap alone fans out one compiler per
# stdlib package) exhausts that cap and fork() fails with EAGAIN
# ("resource temporarily unavailable") — that killed dev-lang/go-1.26.7
# in stage3-base-c on 2026-09-02.
#
# pids_limit = -1 (unlimited) removes the cap; the host has 211GB RAM and
# vm.overcommit_memory=1, so process fan-out is not the resource at risk.
[containers]
pids_limit = -1
